<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>ENTX</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#0b0e13;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .glow{position:absolute;top:50%;left:50%;width:300px;height:140px;transform:translate(-50%,-62%);
    border-radius:50%;background:radial-gradient(circle,rgba(0,255,90,.16),transparent 70%);filter:blur(10px)}
  .mark{position:relative;display:flex;align-items:center;gap:12px;opacity:0;transform:scale(.86);
    animation:in .55s ease forwards}
  .mark svg{width:44px;height:39px;filter:drop-shadow(0 4px 16px rgba(0,255,90,.45))}
  .mark h1{color:#f2f5f8;font-size:31px;font-weight:800;letter-spacing:1px;margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  .mark h1 i{font-style:normal}
  .bar{position:relative;margin-top:26px;width:64px;height:3px;border-radius:3px;background:rgba(0,255,90,.16);overflow:hidden;opacity:0;animation:in .4s .25s ease forwards}
  .bar::after{content:"";position:absolute;left:-40%;top:0;width:40%;height:100%;background:#00FF5A;border-radius:3px;animation:run .9s .3s ease-in-out infinite}
  @keyframes in{to{opacity:1;transform:scale(1)}}
  @keyframes run{to{left:100%}}
  @keyframes out{to{opacity:0}}
  body.done{animation:out .35s ease forwards}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="mark">
    <svg viewBox="0 0 88 78"><g fill="#00ff00">
      <polygon points="0,0 38,0 58.1,36 20.1,36"/>
      <polygon points="50,0 88,0 69,36"/>
      <polygon points="18.8,41 57.8,41 39,77 0,77"/>
      <polygon points="69,41 88,78 50,78"/>
    </g></svg>
    <h1>ENTX<i>·熵</i></h1>
  </div>
  <div class="bar"></div>
  <script>
    setTimeout(function(){ document.body.classList.add('done'); }, 1050);
    setTimeout(function(){ location.replace('https://h5.entx.site/'); }, 1400);
  </script>
</body>
</html>
